server:
  port: 8084

spring:
  application:
    name: core-banking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/cbs_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  cbs:
    # System account that receives transfer fees. Created automatically at startup.
    fee-account-number: FEE-INCOME
    fee-account-currency: USD