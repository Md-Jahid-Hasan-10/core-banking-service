server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: core-banking-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  application:
    name: core-banking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbs_db}
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: core-banking-service
        auto-offset-reset: earliest
        enable-auto-commit: false
      listener:
        ack-mode: record
        concurrency: 3
      producer:
        acks: all
        properties:
          enable.idempotence: true
          linger.ms: 0
          max.block.ms: 5000
          request.timeout.ms: 5000
          delivery.timeout.ms: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  cbs:
    fee-account-number: FEE-INCOME
    fee-account-currency: USD
    transit-account-number: TRANSFER-TRANSIT
    transit-account-currency: USD
  messaging:
      producer-name: core-banking-service
      relay-interval-ms: 1000
management:
  server:
    port: 18083
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true