server:
  port: 8084

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: core-banking-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
      concurrency: 3
      observation-enabled: true
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 0
        # max.block.ms must be at least as long as delivery.timeout.ms, and
        # the publisher waits longer than both. Otherwise a publish can be
        # reported as failed while the message is still on its way, and the
        # retry sends it a second time.
        max.block.ms: 15000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true

  application:
    name: core-banking-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/cbs_db}
    username: ${DB_USERNAME:banking_admin}
    password: ${DB_PASSWORD:postgre2188}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      consumer:
        group-id: core-banking-service
        auto-offset-reset: earliest
        enable-auto-commit: false
      listener:
        ack-mode: record
        concurrency: 3
      producer:
        acks: all
        properties:
          enable.idempotence: true
          linger.ms: 0
          max.block.ms: 5000
          request.timeout.ms: 5000
          delivery.timeout.ms: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

app:
  cbs:
    fee-account-number: FEE-INCOME
    fee-account-currency: USD
    transit-account-number: TRANSFER-TRANSIT
    transit-account-currency: USD
  messaging:
      producer-name: core-banking-service
      relay-interval-ms: 1000
  observability:
    log-bodies: true
    max-body-length: 2048

management:
  server:
    port: 18084
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        api.calls: true
        kafka.consume: true
        client.calls: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      file: logstash
    json:
      add:
        service: ${spring.application.name}
  file:
    name: ${BANKING_LOG_DIR:${user.home}/banking-logs}/${spring.application.name}.json
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 3
      total-size-cap: 200MB